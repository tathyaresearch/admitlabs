<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Drishti sign-in code</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;display=swap"
    />
  </head>
  <body style="margin: 0; padding: 0; background: #0a0a0c">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #0a0a0c">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #1e1f23; border-radius: 8px"
          >
            <tr>
              <td
                style="
                  padding: 32px 32px 0;
                  font-family: 'Bricolage Grotesque', sans-serif;
                  color: #f2e8d6;
                  font-size: 15px;
                  letter-spacing: -0.01em;
                "
              >
                <span style="font-weight: 800">Admit</span><span style="font-weight: 400">Labs</span>
                <span style="color: #8a8d94">&nbsp;&nbsp;Drishti</span>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 28px 32px 0;
                  font-family: 'Bricolage Grotesque', sans-serif;
                  color: #f2e8d6;
                  font-size: 28px;
                  line-height: 1.1;
                  font-weight: 700;
                  letter-spacing: -0.03em;
                "
              >
                Your sign-in code
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 32px 0">
                <span
                  style="
                    display: inline-block;
                    background: #f2e8d6;
                    color: #0a0a0c;
                    font-family: 'Bricolage Grotesque', sans-serif;
                    font-size: 36px;
                    font-weight: 800;
                    letter-spacing: 0.18em;
                    padding: 10px 14px 10px 18px;
                    border-radius: 2px;
                  "
                  >{{ .Token }}</span
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px 0;
                  font-family: 'Bricolage Grotesque', sans-serif;
                  color: #f2e8d6;
                  font-size: 15px;
                  line-height: 1.55;
                "
              >
                Enter this code on the Drishti sign-in page. It works for 10 minutes.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 12px 32px 32px;
                  font-family: 'Bricolage Grotesque', sans-serif;
                  color: #8a8d94;
                  font-size: 13px;
                  line-height: 1.5;
                "
              >
                Did not ask for this code? You can ignore this email. Nobody can sign in without it.
              </td>
            </tr>
          </table>
          <p
            style="
              margin: 20px 0 0;
              font-family: 'Bricolage Grotesque', sans-serif;
              color: #8a8d94;
              font-size: 12px;
            "
          >
            Drishti by AdmitLabs. See where you stand, who's ahead, and what students want.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
